<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导览卡 · 机柜CQ · DW定位指令</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- MQTT.js 库 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }
        .container {
            max-width: 100%;
            width: 100%;
        }

        /* 折叠面板通用样式 */
        details {
            background: white;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        details[open] {
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        summary {
            padding: 1rem 1.8rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a3b5d;
            cursor: pointer;
            border-radius: 1.5rem;
            background: #f8fafd;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        summary::before {
            content: "▶";
            font-size: 0.9rem;
            transition: transform 0.2s;
            margin-right: 8px;
        }
        details[open] summary::before {
            transform: rotate(90deg);
        }
        .details-content {
            padding: 1rem 1.8rem 1.5rem;
            border-top: 1px solid #dee9f2;
        }

        /* 原有样式保持兼容 */
        .header {
            background: white;
            border-radius: 2rem;
            padding: 1rem 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.03);
        }
        .title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight:500;
            color: #1a3b5d;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 i { color: #2e7daf; font-size: 2rem; }

        .mqtt-real-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            background: #f0f6fd;
            border-radius: 30px;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem 0 0.8rem 0;
            font-size: 0.8rem;
        }
        .mqtt-real-bar input, .mqtt-real-bar select {
            padding: 6px 10px;
            border: 1px solid #b9d0e7;
            border-radius: 30px;
            background: white;
            font-size: 0.8rem;
            min-width: 150px;
        }
        .mqtt-real-bar .small-input { min-width: 100px; }
        .mqtt-real-bar button {
            background: #d9e6f5; border: none; padding: 6px 16px;
            border-radius: 30px; font-weight: 600; color: #1e3f60;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.8rem;
        }
        .mqtt-real-bar button.primary { background: #1e3b5c; color: white; }
        .mqtt-real-bar button.danger { background: #e53e3e; color: white; }
        .mqtt-real-bar .status-indicator {
            display: flex; align-items: center; gap: 5px;
            background: #e9f0f9; padding: 4px 12px; border-radius: 30px;
        }
        .indicator {
            width: 10px; height: 10px; border-radius: 50%; background: #ff3b30;
        }
        .indicator.connected { background: #4cd964; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .mqtt-endpoint {
            background: #d4e2f0; padding: 4px 12px; border-radius: 30px;
            font-family: monospace; font-size: 0.75rem; color: #0b2d4b;
        }

        .mqtt-pubsub {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            background: #f8fafd;
            border-radius: 30px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 0.8rem;
            align-items: center;
        }
        .mqtt-pubsub .form-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mqtt-pubsub input, .mqtt-pubsub textarea {
            padding: 5px 8px;
            border: 1px solid #b9d0e7;
            border-radius: 20px;
            font-size: 0.8rem;
            background: white;
        }
        .mqtt-pubsub textarea {
            width: 200px;
            height: 32px;
            resize: vertical;
            font-family: monospace;
        }
        .mqtt-pubsub button {
            background: #d9e6f5; border: none; padding: 5px 14px;
            border-radius: 30px; font-weight: 600; color: #1e3f60;
            cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
        }
        .mqtt-pubsub button.primary { background: #1e3b5c; color: white; }

        .cabinet-info-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px 25px;
            background: #e3eef9;
            border-radius: 40px;
            padding: 0.7rem 2rem;
            margin: 0.5rem 0 1rem 0;
            font-size: 0.9rem;
        }
        .cabinet-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cabinet-info-item .label {
            font-weight: 600;
            color: #1e3f60;
            background: #d4e2f0;
            padding: 3px 10px;
            border-radius: 30px;
        }
        .cabinet-info-item .value {
            font-family: monospace;
            background: white;
            padding: 3px 12px;
            border-radius: 30px;
            color: #0b2d4b;
            border: 1px solid #b9d0e7;
        }
        .cabinet-info-bar button {
            background: #1e3b5c;
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            transition: 0.2s;
        }
        .cabinet-info-bar button:hover {
            background: #2b4d75;
        }

        .subscriptions {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px;
        }
        .subscription-tag {
            background: #e6f7ff; border: 1px solid #91d5ff; color: #1890ff;
            padding: 2px 8px; border-radius: 20px; font-size: 0.75rem;
            display: flex; align-items: center; gap: 4px;
        }
        .subscription-tag i { cursor: pointer; }
        .subscription-tag i:hover { color: #ff4d4f; }

        .log-container {
            background: #1a2a3a; color: #b0e0ff; border-radius: 24px;
            padding: 12px 15px; font-family: monospace; font-size: 0.75rem;
            width: 100%; max-height: 200px; overflow-y: auto;
            margin: 8px 0; white-space: pre-wrap;
        }
        .log-message {
            border-left: 3px solid #1a6dcc; padding-left: 8px; margin-bottom: 5px;
            border-bottom: 1px solid #2a3f54;
        }
        .log-message.incoming { border-left-color: #38a169; }
        .log-message.outgoing { border-left-color: #d69e2e; }
        .log-message.error { border-left-color: #e53e3e; background: #2a1f2a; }
        .log-header { display: flex; gap: 10px; color: #a0c4e5; }
        .log-timestamp { color: #7f9fbf; }

        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0 10px 0;
            background: #e9f0f9;
            border-radius: 40px;
            padding: 10px 20px;
        }
        .tab-button {
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tab-button.power-on { background: #27ae60; }
        .tab-button.power-off { background: #e53e3e; }
        .tab-button.active {
            box-shadow: 0 0 0 2px white, 0 4px 8px rgba(0,0,0,0.2);
            opacity: 0.9;
        }
        .tab-button:hover { transform: scale(1.05); }

        .tab-panel {
            display: none;
            background: white;
            border-radius: 2rem;
            padding: 1.5rem 2rem;
            margin-top: 0.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.03);
        }
        .tab-panel.active { display: block; }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee9f2;
        }
        .panel-guid {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a3b5d;
            min-width: 300px;
        }
        .scene-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #f0f6fd;
            padding: 5px 12px;
            border-radius: 30px;
        }
        .scene-label { font-weight: 600; color: #1f4a7a; font-size: 0.9rem; margin-right: 4px; }
        .scene-radio { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: #1f4a7a; }
        .scene-radio input[type="radio"] { margin: 0; width: 14px; height: 14px; }
        .button-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .power-button, .location-button {
            border: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .power-button.on { background: #27ae60; }
        .power-button.off { background: #e53e3e; }
        .location-button { background: #3b82f6; }
        .location-button:hover { background: #2563eb; transform: scale(1.02); }
        .power-button:hover { transform: scale(1.02); }

        .manual-coords {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 8px 12px;
            background: #f8fafd;
            border-radius: 30px;
        }
        .coord-item { display: flex; align-items: center; gap: 5px; }
        .coord-item label { font-weight: 600; color: #1f4a7a; font-size: 0.85rem; }
        .coord-item input {
            padding: 4px 8px;
            border: 1px solid #b9d0e7;
            border-radius: 20px;
            width: 100px;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px 20px;
        }
        .param-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed #dee9f2;
        }
        .param-label { font-weight: 600; color: #1f4a7a; min-width: 140px; }
        .param-value {
            font-family: monospace;
            background: #f5f9ff;
            padding: 4px 12px;
            border-radius: 20px;
            color: #0b2d4b;
            word-break: break-all;
        }
        .guid-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .guid-selector select {
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #b9d0e7;
            font-family: monospace;
            background: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-row">
            <h1><i class="fa-solid fa-id-card"></i> 导览卡 · DW定位指令</h1>
        </div>

        <!-- 折叠面板1：MQTT连接与发布订阅 -->
        <details open>
            <summary><i class="fas fa-plug"></i> MQTT连接与发布订阅设置</summary>
            <div class="details-content">
                <div class="mqtt-real-bar">
                    <div class="status-indicator">
                        <span class="indicator" id="mqttIndicator"></span>
                        <span id="mqttStatus">未连接</span>
                    </div>
                    <input type="text" id="brokerUrl" value="aawxxeu.iot.gz.baidubce.com" placeholder="Broker地址" readonly style="background:#eef2f5;">
                    <input type="text" id="clientId" value="C_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" placeholder="ClientID" class="small-input">
                    <input type="text" id="username" value="" placeholder="用户名">
                    <input type="password" id="password" value="" placeholder="密码">
                    <button class="primary" id="connectBtn"><i class="fas fa-plug"></i> 连接</button>
                    <button class="danger" id="disconnectBtn" disabled><i class="fas fa-power-off"></i> 断开</button>
                    <span class="mqtt-endpoint" id="mqttEndpoint">wss://aawxxeu.iot.gz.baidubce.com:443/mqtt</span>
                </div>
                <div class="mqtt-pubsub">
                    <div class="form-item">
                        <i class="fas fa-paper-plane" style="color:#1a6dcc;"></i>
                        <input type="text" id="pubTopic" placeholder="发布主题">
                    </div>
                    <div class="form-item">
                        <textarea id="pubMessage" placeholder="消息内容">{"msg":"hello"}</textarea>
                    </div>
                    <button class="primary" id="publishBtn" disabled><i class="fas fa-paper-plane"></i> 发布</button>
                    <div class="form-item" style="margin-left: auto;">
                        <i class="fas fa-plus-circle"></i>
                        <input type="text" id="subTopic" placeholder="订阅主题">
                    </div>
                    <button id="subscribeBtn" disabled><i class="fas fa-plus"></i> 订阅</button>
                </div>
                <div class="subscriptions" id="subscriptionsList"></div>
            </div>
        </details>

        <!-- 折叠面板2：日志与导览卡GUID选择 -->
        <details open>
            <summary><i class="fas fa-list-alt"></i> 日志与导览卡快速选择</summary>
            <div class="details-content">
                <div class="guid-selector">
                    <span><i class="fas fa-id-card"></i> 切换导览卡：</span>
                    <select id="guidSelect"></select>
                </div>
                <div class="log-container" id="mqttLog"></div>
            </div>
        </details>

        <!-- 机柜CQ栏保留 -->
        <div class="cabinet-info-bar" id="cabinetInfoBar">
            <div class="cabinet-info-item">
                <span class="label">机柜GUID</span>
                <span class="value" id="cabinetGuidDisplay">-</span>
            </div>
            <div class="cabinet-info-item">
                <span class="label">群ID</span>
                <span class="value" id="cabinetGroupIdDisplay">-</span>
            </div>
            <button id="sendCQBtn"><i class="fas fa-server"></i> 发送CQ状态</button>
        </div>

        <!-- 选项卡导航 -->
        <div class="tab-nav" id="tabNav"></div>
    </div>

    <!-- 8个选项卡面板容器 -->
    <div id="tabPanelsContainer"></div>
</div>

<script>
    (function() {
        // ----- 全局变量 -----
        const pubTopicInput = document.getElementById('pubTopic');
        const tabNav = document.getElementById('tabNav');
        const tabPanelsContainer = document.getElementById('tabPanelsContainer');
        const cabinetGuidSpan = document.getElementById('cabinetGuidDisplay');
        const cabinetGroupIdSpan = document.getElementById('cabinetGroupIdDisplay');
        const guidSelect = document.getElementById('guidSelect');

        let guides = [];
        let cabinetGuid = 'CAB_' + randomHex32().substring(0, 12);
        let cabinetGroupId = '';
        const sceneOptions = ['0001', '0002', '0003', '0004', '0005', '0006'];

        // 辅助函数
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randomHex32() { return Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16).toUpperCase()).join(''); }
        function randomIMEI() { return Array.from({length:15},()=>Math.floor(Math.random()*10)).join(''); }
        function randomFW() {
            const prefixes = ['TP1024SFX_ES_A_V', 'FW_VER_', 'RELEASE_'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const main = randomInt(1,20)+'.'+randomInt(1,30)+'.'+randomInt(1,999);
            return (prefix + main).toUpperCase();
        }
        function randomCCID() {
            let digits = '';
            for(let i=0;i<20;i++) digits += Math.floor(Math.random()*10);
            return digits.slice(0,10)+' '+digits.slice(10);
        }
        function randomGroupID() { return Array.from({length:8},()=>String.fromCharCode(65+Math.floor(Math.random()*26))).join(''); }
        function randomBeacon() { return `BEACON_${randomInt(1,100).toString().padStart(3,'0')}`; }
        function randomRssi() { return randomInt(-95, -30); }

        function generateGuides() {
            guides = [];
            for (let i = 0; i < 8; i++) {
                const guid = randomHex32();
                guides.push({
                    guid,
                    imei: randomIMEI(),
                    fwVersion: randomFW(),
                    simCcid: randomCCID(),
                    groupID: randomGroupID(),
                    powerOn: false,
                    dynamicData: {
                        signalStrength: randomInt(-100,-50),
                        signal4G: randomInt(-105,-65),
                        signalWiFi: randomInt(-80,-40),
                        latitude: (39 + Math.random()*2).toFixed(6),
                        longitude: (115 + Math.random()*2).toFixed(6),
                        lac: randomInt(0,65535),
                        ci: randomInt(0,65535),
                        bootTime: new Date().toISOString().slice(0,10).replace(/-/g,'-')+' '+new Date().toTimeString().slice(0,8),
                        uptime: randomInt(60,1000000),
                        storageTotal: 64,
                        storageUsed: randomInt(0,64),
                        fileCount: randomInt(0,5000),
                        batteryLevel: randomInt(0,100),
                        volume: 85,
                        orderDuration: randomInt(0,500),
                        conversationCount: randomInt(0,1000),
                        indoorX: (Math.random()*100).toFixed(2),
                        indoorY: (Math.random()*100).toFixed(2),
                        scene: sceneOptions[0],
                        playContentCount: randomInt(0,100),
                        recognizeImageCount: randomInt(0,100),
                        photoCount: randomInt(0,50),
                        videoSeconds: randomInt(0,3600),
                        charging: Math.random() > 0.5,
                        bleBeacon: randomBeacon(),
                        bleRssi: randomRssi()
                    }
                });
            }
            if(guides.length>0) {
                cabinetGroupId = guides[0].groupID;
                cabinetGuidSpan.textContent = cabinetGuid;
                cabinetGroupIdSpan.textContent = cabinetGroupId;
            }
            updateGuidSelect();
        }

        function updateGuidSelect() {
            guidSelect.innerHTML = '';
            guides.forEach((g, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `${g.guid.substring(0,12)}... (${idx+1})`;
                if(idx === 0) option.selected = true;
                guidSelect.appendChild(option);
            });
        }

        function renderTabs() {
            tabNav.innerHTML = '';
            tabPanelsContainer.innerHTML = '';

            guides.forEach((guide, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-button ${guide.powerOn ? 'power-on' : 'power-off'}${index === 0 ? ' active' : ''}`;
                btn.dataset.index = index;
                btn.textContent = guide.guid.substring(0,8)+'…';
                btn.addEventListener('click', () => switchTab(index));
                tabNav.appendChild(btn);

                const panel = document.createElement('div');
                panel.className = 'tab-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = index;
                panel.id = `panel-${index}`;
                panel.innerHTML = generatePanelContent(guide, index);
                tabPanelsContainer.appendChild(panel);
            });

            guides.forEach((guide, index) => bindPanelEvents(guide, index));
        }

        function generatePanelContent(guide, index) {
            const d = guide.dynamicData;
            const uptimeMinutes = (d.uptime / 60).toFixed(1);
            const powerStatus = guide.powerOn ? '开机' : '关机';
            const powerClass = guide.powerOn ? 'on' : 'off';

            let sceneRadiosHTML = '';
            sceneOptions.forEach(scene => {
                sceneRadiosHTML += `<label class="scene-radio"><input type="radio" name="scene-${index}" value="${scene}" ${scene === d.scene ? 'checked' : ''}>${scene}</label>`;
            });

            return `
                <div class="panel-header">
                    <span class="panel-guid">${guide.guid}</span>
                    <div class="scene-group" id="scene-group-${index}">
                        <span class="scene-label">场景</span>
                        ${sceneRadiosHTML}
                    </div>
                    <div class="button-group">
                        <button class="location-button" data-index="${index}" id="locationBtn-${index}">
                            <i class="fa-solid fa-location-dot"></i> 定位
                        </button>
                        <button class="power-button ${powerClass}" data-index="${index}" id="powerBtn-${index}">
                            <i class="fa-solid fa-power-off"></i> ${powerStatus}
                        </button>
                    </div>
                </div>
                <details open class="card-details">
                    <summary>📋 设备详细信息（坐标/参数/蓝牙）</summary>
                    <div class="details-content">
                        <div class="manual-coords" id="coords-${index}">
                            <div class="coord-item"><label>GPS纬度</label><input type="text" class="gps-lat" value="${d.latitude}" data-index="${index}"></div>
                            <div class="coord-item"><label>GPS经度</label><input type="text" class="gps-lng" value="${d.longitude}" data-index="${index}"></div>
                            <div class="coord-item"><label>室内X</label><input type="text" class="indoor-x" value="${d.indoorX}" data-index="${index}"></div>
                            <div class="coord-item"><label>室内Y</label><input type="text" class="indoor-y" value="${d.indoorY}" data-index="${index}"></div>
                        </div>
                        <div class="params-grid">
                            <div class="param-item"><span class="param-label">群ID</span><span class="param-value">${guide.groupID}</span></div>
                            <div class="param-item"><span class="param-label">IMEI</span><span class="param-value">${guide.imei}</span></div>
                            <div class="param-item"><span class="param-label">固件版本</span><span class="param-value">${guide.fwVersion}</span></div>
                            <div class="param-item"><span class="param-label">SIM CCID</span><span class="param-value">${guide.simCcid}</span></div>
                            <div class="param-item"><span class="param-label">4G信号</span><span class="param-value" id="signal4G-${index}">${d.signal4G}</span> dBm</div>
                            <div class="param-item"><span class="param-label">WiFi信号</span><span class="param-value" id="signalWiFi-${index}">${d.signalWiFi}</span> dBm</div>
                            <div class="param-item"><span class="param-label">信号强度</span><span class="param-value" id="signalStrength-${index}">${d.signalStrength}</span> dBm</div>
                            <div class="param-item"><span class="param-label">LAC, CI</span><span class="param-value">${d.lac}, ${d.ci}</span></div>
                            <div class="param-item"><span class="param-label">开机时间</span><span class="param-value">${d.bootTime}</span></div>
                            <div class="param-item"><span class="param-label">累计运行</span><span class="param-value" id="uptime-${index}">${uptimeMinutes}</span> 分钟</div>
                            <div class="param-item"><span class="param-label">存储空间</span><span class="param-value">${d.storageTotal} GB</span></div>
                            <div class="param-item"><span class="param-label">使用空间</span><span class="param-value">${d.storageUsed} GB</span></div>
                            <div class="param-item"><span class="param-label">文件数</span><span class="param-value">${d.fileCount}</span></div>
                            <div class="param-item"><span class="param-label">电量</span><span class="param-value" id="battery-${index}">${d.batteryLevel}</span>%</div>
                            <div class="param-item"><span class="param-label">音量</span><span class="param-value">${d.volume}%</span></div>
                            <div class="param-item"><span class="param-label">订单时长</span><span class="param-value" id="orderDuration-${index}">${d.orderDuration}</span> 分钟</div>
                            <div class="param-item"><span class="param-label">对话次数</span><span class="param-value" id="conversationCount-${index}">${d.conversationCount}</span></div>
                            <div class="param-item"><span class="param-label">播放内容</span><span class="param-value" id="playContent-${index}">${d.playContentCount}</span> 条</div>
                            <div class="param-item"><span class="param-label">识别图片</span><span class="param-value" id="recognizeImage-${index}">${d.recognizeImageCount}</span> 次</div>
                            <div class="param-item"><span class="param-label">拍照</span><span class="param-value" id="photo-${index}">${d.photoCount}</span> 次</div>
                            <div class="param-item"><span class="param-label">录像</span><span class="param-value" id="video-${index}">${d.videoSeconds}</span> 秒</div>
                            <div class="param-item"><span class="param-label">充电状态</span><span class="param-value" id="charging-${index}">${d.charging ? '⚡充电中' : '🔋未充电'}</span></div>
                            <div class="param-item"><span class="param-label">蓝牙信标</span><span class="param-value" id="bleBeacon-${index}">${d.bleBeacon}</span></div>
                            <div class="param-item"><span class="param-label">蓝牙信标强度</span><span class="param-value" id="bleRssi-${index}">${d.bleRssi}</span> dBm</div>
                        </div>
                    </div>
                </details>
            `;
        }

        function bindPanelEvents(guide, index) {
            const radios = document.querySelectorAll(`input[name="scene-${index}"]`);
            radios.forEach(radio => radio.addEventListener('change', (e) => { if(e.target.checked) guide.dynamicData.scene = e.target.value; }));

            const coordsDiv = document.getElementById(`coords-${index}`);
            if(coordsDiv) {
                coordsDiv.querySelector('.gps-lat')?.addEventListener('change', e => guide.dynamicData.latitude = e.target.value);
                coordsDiv.querySelector('.gps-lng')?.addEventListener('change', e => guide.dynamicData.longitude = e.target.value);
                coordsDiv.querySelector('.indoor-x')?.addEventListener('change', e => guide.dynamicData.indoorX = e.target.value);
                coordsDiv.querySelector('.indoor-y')?.addEventListener('change', e => guide.dynamicData.indoorY = e.target.value);
            }

            document.getElementById(`powerBtn-${index}`)?.addEventListener('click', () => togglePower(guide, index));
            document.getElementById(`locationBtn-${index}`)?.addEventListener('click', () => sendDwCommand(guide, index));
        }

        function togglePower(guide, index) {
            guide.powerOn = !guide.powerOn;
            sendKjBroadcast(guide);
            sendCommand(guide, 'GJ', guide.powerOn ? 'ManualON' : 'ManualOFF');
            updatePowerButton(guide, index);
            updateTabButton(index, guide.powerOn);
        }

        function sendDwCommand(guide, index) {
            const d = guide.dynamicData;
            const fields = [
                guide.guid,
                d.latitude.toString(),
                d.longitude.toString(),
                d.indoorX.toString(),
                d.indoorY.toString(),
                d.lac.toString(),
                d.ci.toString(),
                d.scene,
                d.bleBeacon,
                d.bleRssi.toString()
            ];
            const upperFields = fields.map(f => f.toUpperCase());
            const dataPart = 'DW,' + upperFields.join(',') + ',';
            const key = 'VANEX';
            const crc = crc16Modbus(dataPart + key).toString(16).toUpperCase().padStart(4,'0');
            const message = '{' + dataPart + crc + '}\r\n';
            sendMqttMessageToGuid(guide.guid, message);
        }

        function sendKjBroadcast(guide) {
            const d = guide.dynamicData;
            const fields = [guide.guid, guide.imei, guide.fwVersion, guide.simCcid, d.signalStrength.toString(), d.latitude.toString(), d.longitude.toString(), d.lac.toString(), d.ci.toString(), d.bootTime, d.uptime.toString(), d.storageTotal.toString(), d.storageUsed.toString(), d.fileCount.toString()];
            const upperFields = fields.map(f => f.toUpperCase());
            const dataPart = 'KJ,' + upperFields.join(',') + ',';
            const crc = crc16Modbus(dataPart + 'VANEX').toString(16).toUpperCase().padStart(4,'0');
            sendMqttMessageToGuid(guide.guid, '{' + dataPart + crc + '}\r\n');
        }

        function sendCommand(guide, cmd, param) {
            const dataPart = `${cmd},${guide.guid},${param},`;
            const crc = crc16Modbus(dataPart + 'VANEX').toString(16).toUpperCase().padStart(4,'0');
            sendMqttMessageToGuid(guide.guid, '{' + dataPart + crc + '}\r\n');
        }

        function sendMqttMessageToGuid(guid, msg) {
            if(!isConnected) { addMqttLog('MQTT未连接', '系统', 'error'); return; }
            const topic = `guide/event/${guid}`;
            mqttClient.publish(topic, msg, { qos: 0 }, err => {
                if(err) addMqttLog(`发送失败: ${err.message}`, topic, 'error');
                else addMqttLog(msg, topic, 'info', false);
            });
        }

        function updatePowerButton(guide, index) {
            const btn = document.getElementById(`powerBtn-${index}`);
            if(btn) {
                const status = guide.powerOn ? '开机' : '关机';
                btn.className = `power-button ${guide.powerOn ? 'on' : 'off'}`;
                btn.innerHTML = `<i class="fa-solid fa-power-off"></i> ${status}`;
            }
        }

        function updateTabButton(index, powerOn) {
            const tabBtn = document.querySelector(`.tab-button[data-index="${index}"]`);
            if(tabBtn) { tabBtn.classList.remove('power-on','power-off'); tabBtn.classList.add(powerOn ? 'power-on' : 'power-off'); }
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelector(`.tab-button[data-index="${index}"]`).classList.add('active');
            document.getElementById(`panel-${index}`).classList.add('active');
            if(guidSelect) guidSelect.value = index;
        }

        function startDynamicUpdates() {
            setInterval(() => {
                guides.forEach(guide => { guide.dynamicData.uptime++; const idx = guides.indexOf(guide); const span = document.getElementById(`uptime-${idx}`); if(span) span.textContent = (guide.dynamicData.uptime/60).toFixed(1); });
            }, 1000);
            setInterval(() => {
                guides.forEach(guide => {
                    const d = guide.dynamicData;
                    d.signalStrength = randomInt(-100,-50);
                    d.signal4G = randomInt(-105,-65);
                    d.signalWiFi = randomInt(-80,-40);
                    d.batteryLevel = randomInt(0,100);
                    d.orderDuration = randomInt(0,500);
                    d.conversationCount = randomInt(0,1000);
                    d.playContentCount = randomInt(0,100);
                    d.recognizeImageCount = randomInt(0,100);
                    d.photoCount = randomInt(0,50);
                    d.videoSeconds = randomInt(0,3600);
                    d.charging = Math.random() > 0.5;
                    d.bleBeacon = randomBeacon();
                    d.bleRssi = randomRssi();
                    const idx = guides.indexOf(guide);
                    document.getElementById(`signalStrength-${idx}`) && (document.getElementById(`signalStrength-${idx}`).textContent = d.signalStrength);
                    document.getElementById(`signal4G-${idx}`) && (document.getElementById(`signal4G-${idx}`).textContent = d.signal4G);
                    document.getElementById(`signalWiFi-${idx}`) && (document.getElementById(`signalWiFi-${idx}`).textContent = d.signalWiFi);
                    document.getElementById(`battery-${idx}`) && (document.getElementById(`battery-${idx}`).textContent = d.batteryLevel);
                    document.getElementById(`orderDuration-${idx}`) && (document.getElementById(`orderDuration-${idx}`).textContent = d.orderDuration);
                    document.getElementById(`conversationCount-${idx}`) && (document.getElementById(`conversationCount-${idx}`).textContent = d.conversationCount);
                    document.getElementById(`playContent-${idx}`) && (document.getElementById(`playContent-${idx}`).textContent = d.playContentCount);
                    document.getElementById(`recognizeImage-${idx}`) && (document.getElementById(`recognizeImage-${idx}`).textContent = d.recognizeImageCount);
                    document.getElementById(`photo-${idx}`) && (document.getElementById(`photo-${idx}`).textContent = d.photoCount);
                    document.getElementById(`video-${idx}`) && (document.getElementById(`video-${idx}`).textContent = d.videoSeconds);
                    document.getElementById(`charging-${idx}`) && (document.getElementById(`charging-${idx}`).textContent = d.charging ? '⚡充电中' : '🔋未充电');
                    document.getElementById(`bleBeacon-${idx}`) && (document.getElementById(`bleBeacon-${idx}`).textContent = d.bleBeacon);
                    document.getElementById(`bleRssi-${idx}`) && (document.getElementById(`bleRssi-${idx}`).textContent = d.bleRssi);
                });
            }, 5000);
        }

        function sendPeriodicReport() {
            guides.forEach(guide => {
                if(guide.powerOn) {
                    const d = guide.dynamicData;
                    const fields = [guide.guid, d.batteryLevel, d.volume, d.orderDuration, d.conversationCount, d.indoorX, d.indoorY, d.signal4G, d.signalWiFi, d.signalStrength, d.scene, d.playContentCount, d.recognizeImageCount, d.photoCount, d.videoSeconds, (d.uptime/60).toFixed(1)];
                    const upper = fields.map(f=>f.toString().toUpperCase());
                    const dataPart = 'TB,' + upper.join(',') + ',';
                    const crc = crc16Modbus(dataPart+'VANEX').toString(16).toUpperCase().padStart(4,'0');
                    sendMqttMessageToGuid(guide.guid, '{' + dataPart + crc + '}\r\n');
                }
            });
        }

        function crc16Modbus(data) { let crc=0xFFFF; for(let i=0;i<data.length;i++){ crc^=data.charCodeAt(i); for(let j=0;j<8;j++){ if(crc&1) crc=(crc>>1)^0xA001; else crc>>=1; } } return crc; }

        // ----- MQTT部分 -----
        let mqttClient = null, isConnected = false, subscriptions = new Set();
        const indicator=document.getElementById('mqttIndicator'), statusText=document.getElementById('mqttStatus');
        const connectBtn=document.getElementById('connectBtn'), disconnectBtn=document.getElementById('disconnectBtn');
        const publishBtn=document.getElementById('publishBtn'), subscribeBtn=document.getElementById('subscribeBtn');
        const brokerUrl=document.getElementById('brokerUrl'), clientIdInput=document.getElementById('clientId');
        const username=document.getElementById('username'), password=document.getElementById('password');
        const pubMessage=document.getElementById('pubMessage'), subTopic=document.getElementById('subTopic');
        const subscriptionsList=document.getElementById('subscriptionsList'), mqttLogDiv=document.getElementById('mqttLog');
        const sendCQBtn=document.getElementById('sendCQBtn');

        function addMqttLog(message, topic='系统', type='info', isIncoming=false) {
            const div=document.createElement('div');
            div.className=`log-message ${isIncoming?'incoming':'outgoing'} ${type==='error'?'error':''}`;
            div.innerHTML=`<div class="log-header"><span class="log-timestamp">${new Date().toLocaleTimeString()}</span><span>${topic}</span></div><div>${message}</div>`;
            mqttLogDiv.prepend(div);
            if(mqttLogDiv.children.length>60) mqttLogDiv.lastElementChild.remove();
        }

        function updateConnectionStatus(connected) {
            isConnected=connected;
            indicator.className='indicator'+(connected?' connected':'');
            statusText.textContent=connected?'已连接':'未连接';
            connectBtn.disabled=connected;
            disconnectBtn.disabled=!connected;
            publishBtn.disabled=!connected;
            subscribeBtn.disabled=!connected;
        }

        function connectToBroker() {
            const fullUrl=`wss://${brokerUrl.value}:443/mqtt`;
            const options={clientId:clientIdInput.value,username:username.value,password:password.value,clean:true,reconnectPeriod:3000,connectTimeout:30000,keepalive:60,resubscribe:true};
            addMqttLog(`连接 ${fullUrl} ...`,'系统');
            mqttClient=mqtt.connect(fullUrl,options);
            mqttClient.on('connect',()=>{
                updateConnectionStatus(true);
                addMqttLog('✅ MQTT已连接','系统');
                guides.forEach(guide=>{ const topic=`guide/event/${guide.guid}`; mqttClient.subscribe(topic,{qos:0},err=>{if(!err){subscriptions.add(topic); updateSubscriptionsList(); addMqttLog(`已订阅 ${topic}`,'系统');}}); });
                mqttClient.subscribe('device/broadcast/online',{qos:0},err=>{if(!err){subscriptions.add('device/broadcast/online'); updateSubscriptionsList(); addMqttLog('已订阅 device/broadcast/online','系统');}});
            });
            mqttClient.on('message',(topic,msg)=>addMqttLog(msg.toString(),topic,'info',true));
            mqttClient.on('error',err=>{addMqttLog(`❌ ${err.message}`,'系统','error'); updateConnectionStatus(false);});
            mqttClient.on('close',()=>{addMqttLog('连接关闭，尝试重连','系统'); updateConnectionStatus(false);});
        }

        function disconnectFromBroker() { if(mqttClient && isConnected) mqttClient.end(true,()=>addMqttLog('已主动断开','系统')); mqttClient=null; updateConnectionStatus(false); subscriptions.clear(); updateSubscriptionsList(); }
        function publishMessage(){ if(!isConnected) return; const topic=pubTopicInput.value.trim(), msg=pubMessage.value.trim(); if(!topic||!msg) return; mqttClient.publish(topic,msg,{qos:0},err=>err?addMqttLog(`发布失败:${err.message}`,'系统','error'):addMqttLog(msg,topic,'info',false)); }
        function subscribeToTopic(){ if(!isConnected) return; const topic=subTopic.value.trim(); if(!topic||subscriptions.has(topic)) return; mqttClient.subscribe(topic,{qos:0},err=>{if(!err){subscriptions.add(topic); updateSubscriptionsList(); addMqttLog(`订阅成功 ${topic}`,'系统'); subTopic.value='';}}); }
        function unsubscribeFromTopic(topic){ if(!mqttClient||!isConnected) return; mqttClient.unsubscribe(topic,err=>{if(!err){subscriptions.delete(topic); updateSubscriptionsList(); addMqttLog(`取消订阅 ${topic}`,'系统');}}); }
        function updateSubscriptionsList(){ subscriptionsList.innerHTML=''; if(subscriptions.size===0){ subscriptionsList.innerHTML='<div style="padding:5px;">暂无订阅</div>'; return; } subscriptions.forEach(t=>{ const tag=document.createElement('span'); tag.className='subscription-tag'; tag.innerHTML=`<span>${t}</span><i class="fas fa-times" data-topic="${t}"></i>`; subscriptionsList.appendChild(tag); }); document.querySelectorAll('.subscription-tag i').forEach(icon=>icon.addEventListener('click',e=>unsubscribeFromTopic(icon.dataset.topic))); }
        function sendCQStatus(){ if(!isConnected){addMqttLog('MQTT未连接','系统','error');return;} let chargingCount=0,powerOnCount=0; const positions=[]; guides.forEach((g,idx)=>{ if(g.dynamicData.charging) chargingCount++; if(g.powerOn) powerOnCount++; positions.push({"槽位":(idx+1).toString().padStart(3,'0'),"导览卡GUID":g.guid,"电量":g.dynamicData.batteryLevel,"充电状态":g.dynamicData.charging?"充电中":"未充电"}); }); const cqPayload={command:"CQ",guid:cabinetGuid,充电数:chargingCount,特充数:0,在槽数:8,空槽数:0,开机数:powerOnCount,关机数:8-powerOnCount,群ID:cabinetGroupId,仓位:positions}; const topic="cabinet/status"; const msg=JSON.stringify(cqPayload,null,2); mqttClient.publish(topic,msg,{qos:0},err=>{if(err)addMqttLog(`CQ发送失败:${err.message}`,topic,'error'); else addMqttLog(msg,topic,'info',false); pubTopicInput.value=topic; pubMessage.value=msg;}); }

        connectBtn.addEventListener('click',connectToBroker);
        disconnectBtn.addEventListener('click',disconnectFromBroker);
        publishBtn.addEventListener('click',publishMessage);
        subscribeBtn.addEventListener('click',subscribeToTopic);
        sendCQBtn.addEventListener('click',sendCQStatus);
        guidSelect.addEventListener('change',e=>switchTab(parseInt(e.target.value)));

        generateGuides();
        renderTabs();
        clientIdInput.value='C_'+guides[0].guid;
        pubTopicInput.value=`guide/event/${guides[0].guid}`;
        addMqttLog('系统初始化完成，支持DW定位指令','系统');
        updateSubscriptionsList();
        setTimeout(()=>connectToBroker(),500);
        setInterval(sendPeriodicReport,15000);
        startDynamicUpdates();
    })();
</script>
</body>
</html>
