# Xiaozhi API Proxy Configuration
# 监听 8002 端口，转发 /xiaozhi/dialog/push 到 Python 容器，其他转发到 Java 容器

server {
    listen 8002;
    server_name _;
    include /opt/xiaozhi-server/deploy-20261004-ota-resume/nginx-download-location.conf;

    # 精确转发 /xiaozhi/dialog/push 到 Python 容器（8003 端口）
    location = /xiaozhi/dialog/push {
        proxy_pass http://172.20.0.2:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    # 其他所有请求转发到 Java 容器（8004 端口）
    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 日志配置
    access_log /www/wwwlogs/xiaozhi-api-proxy.log;
    error_log /www/wwwlogs/xiaozhi-api-proxy.error.log;
}
