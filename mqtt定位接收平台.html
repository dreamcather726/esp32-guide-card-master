<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>MQTT实时轨迹追踪 - 卡片标记 | 高德地图</title>
    <link rel="stylesheet" href="https://a.amap.com/jsapi_demos/static/demo-center/css/demo-center.css"/>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #container {
            height: 100%;
            width: 100%;
        }

        /* 右侧控制面板 - 现代磨砂玻璃风格 */
        .mqtt-control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            transition: all 0.2s ease;
        }

        .mqtt-control-panel h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 600;
            color: white;
            letter-spacing: 0.5px;
            border-left: 3px solid #FF7B2C;
            padding-left: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            font-size: 12px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            transition: all 0.2s;
            box-shadow: 0 0 4px #ef4444;
        }

        .indicator.connected {
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.6; transform: scale(1.15);}
            100% { opacity: 1; transform: scale(1);}
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .last-msg {
            font-size: 10px;
            color: #cbd5e6;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 8px;
            border-radius: 16px;
            margin: 10px 0;
            text-align: center;
            word-break: break-all;
        }

        .track-btn {
            width: 100%;
            padding: 8px 0;
            background: #FF7B2C;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(2px);
        }

        .track-btn:hover {
            background: #e86a1f;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }

        .info-note {
            font-size: 9px;
            color: #a0b3d9;
            text-align: center;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 8px;
        }

        /* 卡片标记通用样式（将作为自定义Marker内容） */
        .device-card-marker {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 123, 44, 0.3);
            padding: 8px 12px;
            min-width: 140px;
            max-width: 180px;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            transition: transform 0.1s ease;
            backdrop-filter: blur(2px);
            cursor: pointer;
            border: 1px solid rgba(255, 123, 44, 0.5);
        }
        .device-card-marker:hover {
            transform: scale(1.02);
            background: #fffef7;
            border-color: #FF7B2C;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #f0e5d2;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .card-header span:first-child {
            font-weight: 700;
            font-size: 13px;
            background: #FF7B2C20;
            padding: 2px 8px;
            border-radius: 30px;
            color: #C2410C;
        }
        .card-coord {
            font-size: 10px;
            color: #2c3e50;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: #f8f9fc;
            padding: 4px 6px;
            border-radius: 12px;
            margin: 4px 0;
        }
        .card-meta {
            font-size: 9px;
            color: #5e6f8d;
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }
        .card-badge {
            background: #FF7B2C10;
            border-radius: 12px;
            padding: 2px 6px;
            color: #FF7B2C;
            font-weight: 600;
        }

        /* 信息窗体样式优化 */
        .marker-info {
            padding: 10px 14px;
            min-width: 260px;
            max-width: 320px;
            font-family: monospace;
            border-radius: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: white;
            border-left: 4px solid #FF7B2C;
        }
        .marker-info h4 {
            margin: 0 0 8px 0;
            color: #FFB347;
            font-size: 14px;
            border-bottom: 1px solid #ffb34750;
            padding-bottom: 4px;
        }
        .marker-info .data-item {
            background: rgba(255,255,255,0.12);
            padding: 4px 8px;
            border-radius: 12px;
            margin: 5px 0;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }
        .marker-info .time-stamp {
            margin-top: 8px;
            color: #ccc;
            font-size: 9px;
            text-align: right;
        }
    </style>
</head>
<body>
<div id="container"></div>

<div class="mqtt-control-panel">
    <h3>📍 实时轨迹追踪 · 卡片定位</h3>
    <div class="status-indicator">
        <span class="indicator" id="mqttIndicator"></span>
        <span class="status-text" id="mqttStatus">未连接</span>
    </div>
    <div class="last-msg" id="lastMsgInfo">等待定位数据...</div>
    <button class="track-btn" id="clearTracksBtn">🗑️ 清除所有轨迹</button>
    <div class="info-note">✨ 卡片标记 | 橙色轨迹 | 仅当目标移出视野时自动跟焦 | 无闪烁</div>
</div>

<script type="text/javascript">
    window._AMapSecurityConfig = {
        securityJsCode: "0f2e96db869078423cacb309f957eb9d"
    };
</script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY"></script>
<script type="text/javascript">
    // ==================== 1. 初始化地图 ====================
    var map = new AMap.Map("container", {
        zoom: 14,
        resizeEnable: true,
        center: [116.397428, 39.90923],  // 初始北京，首点到达后自动适配
        showBuildingBlock: true,
        showLabel: true,
        animateEnable: true   // 启用动画使移动平滑，避免突兀闪烁
    });

    // ==================== 2. MQTT 配置（完全保留自动连接能力）====================
    var mqttClient = null;
    var isConnected = false;
    var topic = 'guide/event/+';
    var fullUrl = 'wss://aawxxeu.iot.gz.baidubce.com:443/mqtt';
    var options = {
        clientId: 'web_client_' + Math.random().toString(16).substring(2, 12),
        username: '',
        password: '',
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 30000,
        keepalive: 60,
        resubscribe: true
    };

    // ==================== 3. 轨迹系统 (高性能折线，不强制刷新地图) ====================
    var trackPointsMap = {};       // { guid: [LngLat, ...] }
    var trackPolylinesMap = {};    // { guid: AMap.Polyline }
    const TRACK_STYLE = {
        strokeColor: '#FF6B35',
        strokeWeight: 5,
        strokeOpacity: 0.9,
        strokeStyle: 'solid',
        lineJoin: 'round',
        lineCap: 'round',
        zIndex: 8
    };
    const MAX_TRACK_POINTS = 800;

    // UI元素
    var indicator = document.getElementById('mqttIndicator');
    var statusText = document.getElementById('mqttStatus');
    var clearBtn = document.getElementById('clearTracksBtn');
    var lastMsgSpan = document.getElementById('lastMsgInfo');

    // 首次定位标记 (地图初始视野)
    var hasInitialZoomDone = false;
    // 用户是否主动干预地图? (为了不破坏体验，但核心逻辑: 只有目标超出边界才移动)
    // 不需要额外干预，完全基于边界检测

    // 更新最后消息提示
    function updateLastMsgTime() {
        const now = new Date();
        lastMsgSpan.innerHTML = `📡 最新数据: ${now.toLocaleTimeString()}`;
    }

    // MQTT连接状态UI
    function updateConnectionStatus(connected) {
        isConnected = connected;
        if (connected) {
            indicator.classList.add('connected');
            statusText.textContent = '已连接';
        } else {
            indicator.classList.remove('connected');
            statusText.textContent = '离线重连';
        }
    }

    // ---------- 轨迹核心：添加点并绘制折线 ----------
    function addTrackPoint(guid, lng, lat) {
        if (!guid || isNaN(lng) || isNaN(lat)) return;
        if (!trackPointsMap[guid]) trackPointsMap[guid] = [];
        const points = trackPointsMap[guid];
        const newPoint = new AMap.LngLat(lng, lat);
        
        // 去重: 距离小于0.8米则跳过，避免冗余轨迹闪烁
        if (points.length > 0) {
            const last = points[points.length - 1];
            const dx = (last.lng - lng) * 111320 * Math.cos(last.lat * Math.PI / 180);
            const dy = (last.lat - lat) * 110540;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 0.8) return;
        }
        
        points.push(newPoint);
        if (points.length > MAX_TRACK_POINTS) points.shift();
        
        // 更新折线（只修改路径，地图不会全局刷新）
        updatePolyline(guid);
    }
    
    function updatePolyline(guid) {
        const points = trackPointsMap[guid];
        if (!points || points.length < 2) {
            if (trackPolylinesMap[guid]) {
                map.remove(trackPolylinesMap[guid]);
                delete trackPolylinesMap[guid];
            }
            return;
        }
        if (trackPolylinesMap[guid]) {
            trackPolylinesMap[guid].setPath(points);
        } else {
            const polyline = new AMap.Polyline({ path: points, ...TRACK_STYLE, map: map });
            trackPolylinesMap[guid] = polyline;
        }
    }
    
    // 清除所有轨迹（保留标记卡片）
    function clearAllTracks() {
        for (let guid in trackPolylinesMap) {
            if (trackPolylinesMap[guid]) map.remove(trackPolylinesMap[guid]);
        }
        trackPointsMap = {};
        trackPolylinesMap = {};
        lastMsgSpan.innerHTML = "🗑️ 轨迹已清除，卡片保留";
        setTimeout(() => { if(isConnected) updateLastMsgTime(); }, 1500);
    }
    
    if (clearBtn) clearBtn.addEventListener('click', () => {
        if (confirm('清除所有设备的移动轨迹？标记点（卡片）不会被删除。')) clearAllTracks();
    });

    // ==================== 4. 坐标转换 (WGS84 -> GCJ02) ====================
    var PI = 3.14159265358979323846;
    var A = 6378245.0;
    var EE = 0.00669342162296594323;
    function wgs84ToGcj02(lon, lat) {
        if (outOfChina(lat, lon)) return [lon, lat];
        let dLat = transformLat(lon - 105.0, lat - 35.0);
        let dLon = transformLon(lon - 105.0, lat - 35.0);
        let radLat = lat / 180.0 * PI;
        let magic = Math.sin(radLat);
        magic = 1 - EE * magic * magic;
        let sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
        dLon = (dLon * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
        return [lon + dLon, lat + dLat];
    }
    function outOfChina(lat, lon) { return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271; }
    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    // ==================== 5. 卡片式标记点（全新样式，无图标闪烁）====================
    // 存储标记对象 { guid: Marker实例, cardDiv: DOM元素引用 }
    var markers = {};

    // 生成卡片DOM内容（动态更新数据）
    function createCardContent(guid, lat, lng, rssiVal, lastTime) {
        const shortGuid = guid.length > 12 ? guid.substring(0, 10) + '..' : guid;
        const latFixed = lat ? lat.toFixed(5) : '---';
        const lngFixed = lng ? lng.toFixed(5) : '---';
        const timeStr = lastTime ? lastTime.toLocaleTimeString() : new Date().toLocaleTimeString();
        const rssiShow = (rssiVal !== undefined && !isNaN(rssiVal)) ? `${rssiVal} dBm` : '--';
        
        return `
            <div class="device-card-marker" style="pointer-events: auto;">
                <div class="card-header">
                    <span>📍 ${shortGuid}</span>
                </div>
                <div class="card-coord">
                    <span>${latFixed}</span>
                    <span>${lngFixed}</span>
                </div>
                <div class="card-meta">
                    <span>📶 ${rssiShow}</span>
                    <span class="card-badge">🕒 ${timeStr}</span>
                </div>
            </div>
        `;
    }

    // 更新卡片内的文本内容（不重建Marker，避免闪烁）
    function updateCardDOM(cardDiv, guid, lat, lng, rssi, updateTime) {
        if (!cardDiv) return;
        const shortGuid = guid.length > 12 ? guid.substring(0, 10) + '..' : guid;
        const latFixed = lat ? lat.toFixed(5) : '---';
        const lngFixed = lng ? lng.toFixed(5) : '---';
        const timeStr = updateTime ? updateTime.toLocaleTimeString() : new Date().toLocaleTimeString();
        const rssiShow = (rssi !== undefined && !isNaN(rssi)) ? `${rssi} dBm` : '--';
        
        // 高效更新DOM内部元素
        const headerSpan = cardDiv.querySelector('.card-header span');
        if (headerSpan) headerSpan.innerHTML = `📍 ${shortGuid}`;
        const coordSpans = cardDiv.querySelectorAll('.card-coord span');
        if (coordSpans.length >= 2) {
            coordSpans[0].innerText = latFixed;
            coordSpans[1].innerText = lngFixed;
        }
        const metaDiv = cardDiv.querySelector('.card-meta');
        if (metaDiv) {
            const rssiSpan = metaDiv.children[0];
            const badgeSpan = metaDiv.children[1];
            if (rssiSpan) rssiSpan.innerHTML = `📶 ${rssiShow}`;
            if (badgeSpan) badgeSpan.innerHTML = `🕒 ${timeStr}`;
        }
    }

    // 创建带卡片样式的Marker
    function createCardMarker(guid, lat, lng, data, initialRssi) {
        const position = new AMap.LngLat(lng, lat);
        const updateTime = new Date();
        const cardHtml = createCardContent(guid, lat, lng, initialRssi, updateTime);
        // 构造一个div元素作为marker的内容
        const cardDiv = document.createElement('div');
        cardDiv.innerHTML = cardHtml;
        cardDiv.style.cursor = 'pointer';
        const contentNode = cardDiv.firstElementChild;
        
        // 高德自定义Marker: 使用content
        const marker = new AMap.Marker({
            position: position,
            content: contentNode,
            anchor: 'bottom-center',   // 卡片底部中心对准坐标点，效果优雅
            offset: new AMap.Pixel(0, -8),
            map: map,
            zIndex: 10
        });
        
        // 保存卡片DOM引用及元数据
        marker.cardDiv = contentNode;
        marker.guid = guid;
        marker.lastData = { lat, lng, rssi: initialRssi, updateTime };
        
        // 添加click事件打开详情信息窗
        const infoWindow = createInfoWindow(guid, data);
        marker.infoWindow = infoWindow;
        marker.on('click', (e) => {
            // 更新infoWindow内容确保最新
            const freshContent = createInfoWindow(guid, { ...data, latitude: lat, longitude: lng }).getContent();
            marker.infoWindow.setContent(freshContent);
            marker.infoWindow.open(map, marker.getPosition());
        });
        
        return marker;
    }
    
    // 详细数据信息窗体（增强显示）
    function createInfoWindow(guid, data) {
        let content = `<div class="marker-info">
            <h4>📡 ${guid}</h4>
            <div class="data-item"><span>🌐 坐标(GCJ02):</span><span>${data.latitude?.toFixed(6) ?? '-'} , ${data.longitude?.toFixed(6) ?? '-'}</span></div>
            <div class="data-item"><span>🏠 室内X/Y:</span><span>${data.indoorX ?? '-'} / ${data.indoorY ?? '-'}</span></div>
            <div class="data-item"><span>📶 LAC/CI:</span><span>${data.lac ?? '-'} / ${data.ci ?? '-'}</span></div>
            <div class="data-item"><span>🏷️ 场景:</span><span>${data.scene ?? '-'}</span></div>
            <div class="data-item"><span>📳 信标/RSSI:</span><span>${data.bleBeacon ?? '-'} / ${data.bleRssi ?? '-'}dBm</span></div>
            <div class="time-stamp">🕒 最后更新: ${new Date().toLocaleString()}</div>
        </div>`;
        return new AMap.InfoWindow({ content: content, offset: new AMap.Pixel(0, -32), autoMove: false });
    }
    
    // 更新Marker位置及卡片内容（无地图全局刷新，仅标记移动）
    function updateMarkerWithCard(guid, lat, lng, data) {
        const position = new AMap.LngLat(lng, lat);
        const currentRssi = data.bleRssi;
        const nowTime = new Date();
        
        if (markers[guid]) {
            const marker = markers[guid];
            // 移动marker位置（轻量级，不触发地图刷新）
            marker.setPosition(position);
            // 更新卡片内显示数据
            if (marker.cardDiv) {
                updateCardDOM(marker.cardDiv, guid, lat, lng, currentRssi, nowTime);
            }
            // 更新内部存储的最新数据
            marker.lastData = { lat, lng, rssi: currentRssi, updateTime: nowTime };
            // 如果信息窗正在显示，可选择性更新内容，但不强制打开
            if (marker.infoWindow && marker.infoWindow.getIsOpen()) {
                const newContent = createInfoWindow(guid, { ...data, latitude: lat, longitude: lng }).getContent();
                marker.infoWindow.setContent(newContent);
            }
        } else {
            // 创建新卡片marker
            const newMarker = createCardMarker(guid, lat, lng, data, currentRssi);
            markers[guid] = newMarker;
            // 默认不自动打开所有信息窗（避免遮挡）
            // 可以短暂显示信息窗3秒后关闭，体验更好（可选），但保持简洁
            if (!hasInitialZoomDone) {
                // 如果是第一个设备且首次打开，短暂显示信息欢迎
                newMarker.infoWindow.open(map, position);
                setTimeout(() => {
                    if(newMarker.infoWindow) newMarker.infoWindow.close();
                }, 4000);
            }
        }
    }

    // ==================== 6. 智能视野管理: 仅当点移出可视范围时才移动地图 ====================
    // 核心: 避免频繁setCenter导致闪烁，保留用户自主控制感，同时自动跟随设备移出视野的情况
    function ensurePointVisibleIfNeeded(position) {
        if (!hasInitialZoomDone) {
            // 首次定位: 设定最佳视野（缩放15，居中）
            map.setZoomAndCenter(15, position);
            hasInitialZoomDone = true;
            return;
        }
        // 获取当前地图边界（世界范围）
        const bounds = map.getBounds();
        if (!bounds) return;
        // 检查新点是否在当前可视范围内
        if (!bounds.contains(position)) {
            // 目标超出可视区域 -> 平滑移动中心（不改变缩放级别，避免地图整体刷新闪烁）
            map.setCenter(position, true, 200); // 动画过渡200ms，丝滑
            // 注: setCenter 不会导致地图闪动，且仅移动视野，轨迹折线无影响
        }
        // 否则：点在视野内，只更新标记和轨迹，地图完全不动 -> 0闪烁！
    }
    
    // ==================== 7. MQTT 消息处理（完全保留自动连接及重连）====================
    function handleMqttMessage(topic, message) {
        try {
            let raw = message.toString().trim();
            if (raw.startsWith('{') && raw.endsWith('}')) raw = raw.slice(1, -1);
            if (raw.endsWith('\r\n')) raw = raw.slice(0, -2);
            const parts = raw.split(',');
            if (parts.length < 2) return;
            const cmd = parts[0].toUpperCase();
            if (cmd === 'DW') {
                parseDW(parts);
                updateLastMsgTime();
            } else if (cmd === 'KJ') {
                // 保留其它消息类型但不处理
                console.log("KJ消息忽略");
            } else if (cmd === 'TB') {
                console.log("TB消息忽略");
            }
        } catch(e) { console.error("解析消息异常", e); }
    }

    function parseDW(parts) {
        if (parts.length < 11) return;
        const guid = parts[1];
        const lat = parseFloat(parts[2]);
        const lng = parseFloat(parts[3]);
        if (isNaN(lat) || isNaN(lng)) return;
        const data = {
            guid: guid, latitude: lat, longitude: lng,
            indoorX: parseFloat(parts[4]), indoorY: parseFloat(parts[5]),
            lac: parts[6], ci: parts[7], scene: parts[8],
            bleBeacon: parts[9], bleRssi: parseInt(parts[10])
        };
        // WGS84 转 GCJ02 (高德地图坐标系)
        const [gcjLng, gcjLat] = wgs84ToGcj02(lng, lat);
        
        // 1. 记录轨迹点 (GCJ02坐标)
        addTrackPoint(guid, gcjLng, gcjLat);
        
        // 2. 更新卡片标记点（仅移动marker + 更新内容，不触发全局地图重绘）
        updateMarkerWithCard(guid, gcjLat, gcjLng, data);
        
        // 3. 视野智能控制: 仅当最新点移出当前地图可视范围时移动中心，否则地图纹丝不动
        const currentPos = new AMap.LngLat(gcjLng, gcjLat);
        ensurePointVisibleIfNeeded(currentPos);
    }

    // ==================== 8. MQTT 连接与自动重连（确保不受卡片修改影响）====================
    function connectToBroker() {
        mqttClient = mqtt.connect(fullUrl, options);
        mqttClient.on('connect', () => {
            updateConnectionStatus(true);
            console.log("✅ MQTT已连接，订阅轨迹主题");
            mqttClient.subscribe(topic, { qos: 0 }, (err) => {
                if (!err) console.log(`订阅成功: ${topic}`);
                else console.error("订阅失败", err);
            });
        });
        mqttClient.on('message', handleMqttMessage);
        mqttClient.on('error', (err) => { 
            console.error("MQTT错误", err); 
            updateConnectionStatus(false);
        });
        mqttClient.on('close', () => {
            updateConnectionStatus(false);
            console.log("MQTT连接关闭，将自动重连");
        });
        mqttClient.on('reconnect', () => console.log("MQTT重连中..."));
    }
    
    connectToBroker();
    
    // 页面关闭时优雅断开
    window.addEventListener('beforeunload', () => { 
        if (mqttClient && isConnected) mqttClient.end(true); 
    });
    
    // 小优化：地图渲染完成后的初次提示
    map.on('complete', () => {
        console.log("地图加载完成，等待定位信号");
    });
</script>
